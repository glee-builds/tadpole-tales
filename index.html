<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fff7ec">
  <title>Tadpole Tales</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="src/stickers.css">
  <link rel="stylesheet" href="src/lesson-screens.css">
</head>
<body>
  <main class="shelf">
    <header class="shelf-top">
      <img class="mascot" src="assets/tadpole.svg" alt="" width="60" height="55">
      <div>
        <h1>Your books</h1>
      </div>
      <!-- The "not saved" mark is added here by app.js. -->
    </header>
    <!-- The book cards are drawn here by app.js. -->
    <div class="books" aria-live="polite"></div>
    <button type="button" class="pill pill-go go"><span aria-hidden="true">+</span> Make a new book</button>
    <p class="install-note"></p>
    <footer class="shelf-foot">
      <!-- Opens the grown-up page when held for 2 seconds. -->
      <button type="button" class="hold-button">For grown-ups: press and hold</button>
      <!-- Saves, then loads the app again (the newest version). -->
      <button type="button" class="pill refresh-button">↻ Refresh</button>
    </footer>
  </main>
  <main class="grownups" hidden></main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
